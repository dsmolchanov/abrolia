app = "abrolia-control-plane-synthetic"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  ABROLIA_CONTROL_PLANE_DB = "/data/control-plane.db"
  ABROLIA_PUBLIC_ORIGIN = "https://app.abrolia.com"
  ABROLIA_MAGIC_LINK_DELIVERY_ENABLED = "1"
  # ABROLIA_MAGIC_LINK_FROM is a Fly secret, not a value here: the fixtures
  # gate refuses a real address in a committed file, and the sender is one.
  ABROLIA_SELF_SIGNUP_ENABLED = "1"
  # Owner decision 2026-09-03: real managed email for every household that
  # registers; the allowlist secret is ignored while this is on.
  ABROLIA_REAL_EMAIL_ALL_HOUSEHOLDS = "1"
  ABROLIA_RUNTIME_PROVIDER = "fly-runtime"
  ABROLIA_SYNTHETIC_ONLY = "1"
  REAL_FAMILY_DATA_ENABLED = "0"
  ABROLIA_REAL_EMAIL_ENABLED = "1"
  ABROLIA_REAL_WHATSAPP_ENABLED = "0"
  ABROLIA_REAL_CHANNEL_ENABLED = "0"
  ABROLIA_FLY_ORG = "abrolia-synthetic"
  ABROLIA_INTERNAL_BOOTSTRAP_HOST = "abrolia-control-plane-synthetic.flycast"

[http_service]
  internal_port = 8080
  # Flycast has no TLS certificates and is HTTP-only. The application redirects
  # every non-Flycast HTTP host to HTTPS before routing any request.
  force_https = false
  auto_start_machines = true
  auto_stop_machines = "off"
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    path = "/healthz"
    timeout = "2s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[mounts]
  source = "control_plane_data"
  destination = "/data"
  initial_size = "1gb"
