name: deploy-production

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        'abrolia-production' ||
        format('abrolia-nondeploy-{0}', github.run_id) }}
  cancel-in-progress: false
  # GitHub added multi-run concurrency queues in May 2026. This prevents a
  # failed/stale workflow_run from evicting a valid green release waiting here.
  queue: max

jobs:
  authorize-release:
    name: authorize current green main
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require the tested commit to remain the main tip
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          test "$current_sha" = "$DEPLOY_SHA"

  deploy-landing:
    name: deploy landing
    needs: authorize-release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: production-landing
      url: https://abrolia.com
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "24"
      - name: Install the pinned Vercel CLI
        run: npm install --global vercel@48.6.0
      - name: Build the landing artifact
        env:
          NO_COLOR: "1"
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          : "${VERCEL_TOKEN:?production-landing VERCEL_TOKEN is not configured}"
          : "${VERCEL_ORG_ID:?production-landing VERCEL_ORG_ID is not configured}"
          : "${VERCEL_PROJECT_ID:?production-landing VERCEL_PROJECT_ID is not configured}"

          vercel pull --yes --environment=production --cwd landing --token "$VERCEL_TOKEN"
          vercel build --prod --cwd landing --token "$VERCEL_TOKEN"
      - name: Recheck main immediately before publishing the landing page
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          test "$current_sha" = "$DEPLOY_SHA"
      - name: Publish the prebuilt landing artifact
        id: deploy
        env:
          NO_COLOR: "1"
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          : "${VERCEL_TOKEN:?production-landing VERCEL_TOKEN is not configured}"
          : "${VERCEL_ORG_ID:?production-landing VERCEL_ORG_ID is not configured}"
          : "${VERCEL_PROJECT_ID:?production-landing VERCEL_PROJECT_ID is not configured}"

          deployment_url="$(
            vercel deploy --prebuilt --prod --yes --cwd landing --token "$VERCEL_TOKEN"
          )"
          case "$deployment_url" in
            https://*.vercel.app) ;;
            *) echo "Vercel returned an invalid deployment URL" >&2; exit 1 ;;
          esac
          printf 'url=%s\n' "$deployment_url" >> "$GITHUB_OUTPUT"
      - name: Verify the deployment and canonical landing domain
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          fetch() {
            local url="$1"
            local destination="$2"
            local status
            status="$(
              curl --fail --silent --show-error \
                --retry 5 --retry-all-errors --retry-delay 2 \
                --connect-timeout 10 --max-time 30 \
                --output "$destination" --write-out '%{http_code}' "$url"
            )"
            test "$status" = 200
          }

          protection_headers="$(
            curl --silent --show-error --head \
              --retry 5 --retry-all-errors --retry-delay 2 \
              --connect-timeout 10 --max-time 30 \
              "${DEPLOYMENT_URL%/}/"
          )"
          grep -Eq '^HTTP/[0-9.]+ 302[[:space:]]*$' <<<"$protection_headers"
          grep -Eiq '^location: https://vercel\.com/sso-api\?url=' \
            <<<"$protection_headers"

          canonical_file="$RUNNER_TEMP/abrolia-canonical-index.html"
          canonical_matches=false
          for _attempt in {1..12}; do
            if fetch https://abrolia.com/ "$canonical_file" && \
              cmp --silent landing/index.html "$canonical_file"
            then
              canonical_matches=true
              break
            fi
            sleep 5
          done
          test "$canonical_matches" = true
          grep -F 'data-abrolia-logo="handwritten-a"' "$canonical_file"
          grep -F 'id="join"' "$canonical_file"

          expected_favicon="$(sha256sum landing/favicon.svg | cut -d ' ' -f1)"
          canonical_favicon_file="$RUNNER_TEMP/abrolia-canonical-favicon.svg"
          fetch https://abrolia.com/favicon.svg "$canonical_favicon_file"
          canonical_favicon="$(sha256sum "$canonical_favicon_file" | cut -d ' ' -f1)"
          test "$canonical_favicon" = "$expected_favicon"

  deploy-control-plane:
    name: deploy control plane
    needs: authorize-release
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment:
      name: production-control-plane
      url: https://app.abrolia.com
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Install the pinned Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        with:
          version: 0.4.58
      - name: Require every boot-critical secret before mutation
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          # `ABROLIA_RUNTIME_MODEL_API_KEY` became required at boot and was
          # named in no deploy configuration, so nothing checked it until a
          # machine tried to start. Production was down for the difference.
          #
          # Resolved against the app's Fly secrets OR `fly.toml [env]`, because
          # a name is satisfied by either and demanding a secret for a
          # non-secret would teach operators to paper over this check.
          : "${FLY_API_TOKEN:?production-control-plane FLY_API_TOKEN is not configured}"
          present="$(
            flyctl secrets list -a abrolia-control-plane-synthetic --json \
              | jq -r '.[].name'
          )"
          missing=()
          while read -r name; do
            [ -n "$name" ] || continue
            case "$name" in \#*) continue ;; esac
            if grep -qx -- "$name" <<<"$present"; then continue; fi
            if grep -qE "^[[:space:]]*$name[[:space:]]*=" deploy/control-plane/fly.toml; then
              continue
            fi
            missing+=("$name")
          done < <(sed 's/#.*//' deploy/control-plane/required-runtime-config.txt | tr -d '\r')
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'missing boot-critical configuration: %s\n' "${missing[*]}" >&2
            echo "set it with: flyctl secrets set <NAME>=... -a abrolia-control-plane-synthetic" >&2
            exit 1
          fi
          echo "all boot-critical configuration is present"
      - name: Require a deployable control plane before mutation
        run: |
          set -euo pipefail
          # `--fail` is deliberately absent: a 503 here is the answer, not an
          # error, and discarding the body threw away the one field that says
          # WHY. The predicate lives in a file so this gate and
          # `tests/control_plane/test_deploy_gate.py` cannot drift apart.
          body="$(mktemp)"
          code="$(
            curl --silent --show-error --location \
              --retry 5 --retry-all-errors --retry-delay 2 \
              --connect-timeout 10 --max-time 30 \
              --output "$body" --write-out '%{http_code}' \
              https://app.abrolia.com/readyz
          )"
          cat "$body"
          # Anything but a served readiness answer is still a refusal: a 500, a
          # 404 or an empty body means this is not the control plane replying.
          test "$code" = 200 || test "$code" = 503
          jq -e -f deploy/control-plane/readyz-deploy-gate.jq "$body" >/dev/null
      - name: Recheck main immediately before publishing the control plane
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          test "$current_sha" = "$DEPLOY_SHA"
      - name: Deploy the synthetic control plane
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          NO_COLOR: "1"
        run: |
          set -euo pipefail
          : "${FLY_API_TOKEN:?production-control-plane FLY_API_TOKEN is not configured}"
          flyctl deploy . \
            --app abrolia-control-plane-synthetic \
            --config deploy/control-plane/fly.toml \
            --dockerfile deploy/control-plane/Dockerfile \
            --remote-only \
            --yes \
            --ha=false \
            --wait-timeout 10m
      - name: Verify control-plane health and public frontend assets
        run: |
          set -euo pipefail
          fetch() {
            curl --fail --silent --show-error --location \
              --retry 12 --retry-all-errors --retry-delay 5 \
              --connect-timeout 10 --max-time 30 "$1"
          }

          health="$(fetch https://app.abrolia.com/healthz)"
          jq -e '.status == "healthy"' <<<"$health" >/dev/null

          # The SAME predicate the pre-deploy gate uses, and for the same
          # reason. This asked `.status == "ready"` behind `--fail`, so it died
          # on the 503 that `backup_stale` produces — a condition a deploy
          # cannot clear unless it happens to carry a migration. The pre-deploy
          # gate was fixed for exactly this and this copy was left behind, so
          # the deploy succeeded and the workflow reported failure anyway.
          #
          # One file, both ends: a second spelling of "is this control plane
          # all right" is how the two drift.
          readyz_body="$(mktemp)"
          readyz_code="$(
            curl --silent --show-error --location \
              --retry 12 --retry-all-errors --retry-delay 5 \
              --connect-timeout 10 --max-time 30 \
              --output "$readyz_body" --write-out '%{http_code}' \
              https://app.abrolia.com/readyz
          )"
          cat "$readyz_body"
          test "$readyz_code" = 200 || test "$readyz_code" = 503
          jq -e -f deploy/control-plane/readyz-deploy-gate.jq "$readyz_body" >/dev/null

          start="$(fetch https://app.abrolia.com/start)"
          grep -F 'data-abrolia-logo="handwritten-a"' <<<"$start"

          pwa="$(fetch https://app.abrolia.com/pwa/index.html)"
          expected_pwa="$(<web/index.html)"
          test "$pwa" = "$expected_pwa"
          grep -F 'data-abrolia-logo="handwritten-a"' <<<"$pwa"

          for asset in manifest.json sw.js static/app.css static/app.js \
            static/favicon.svg static/icon-192.png static/icon-512.png
          do
            expected_hash="$(sha256sum "web/$asset" | cut -d ' ' -f1)"
            deployed_hash="$(
              fetch "https://app.abrolia.com/pwa/$asset" | sha256sum | cut -d ' ' -f1
            )"
            test "$deployed_hash" = "$expected_hash"
          done
