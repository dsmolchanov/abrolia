name: codex-review-window

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

# This workflow is a required status check. It accepts only a Codex review of
# the current PR head. A time-bounded operator exception permits unavailable
# reviews until the subscription resets; P1/[BLOCKER] findings never bypass.
jobs:
  codex-review-window:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      CODEX_BOT: chatgpt-codex-connector[bot]
      REVIEW_FAIL_OPEN_UNTIL_EPOCH: "1786237200" # 2026-08-09T01:00:00Z
    steps:
      - name: Gate on Codex verdict for this commit
        run: |
          set -euo pipefail
          echo "Waiting for Codex review of ${HEAD_SHA} on PR #${PR}"

          review_id_for_head() {
            gh api "repos/${REPO}/pulls/${PR}/reviews" --paginate \
              --jq "[.[] | select(.user.login == \"${CODEX_BOT}\" and .commit_id == \"${HEAD_SHA}\")] | (last | .id) // empty"
          }

          fail_open_is_active() {
            [ "$(date -u +%s)" -lt "${REVIEW_FAIL_OPEN_UNTIL_EPOCH}" ]
          }

          codex_limit_reported() {
            gh api "repos/${REPO}/issues/${PR}/comments" --paginate \
              --jq "[.[] | select(.user.login == \"${CODEX_BOT}\" and (.body | contains(\"usage limits for code reviews\")))] | length"
          }

          # Opening/readying is covered by Codex Automatic Reviews. A push
          # changes HEAD, so request a fresh review when none exists yet.
          if [ "${{ github.event.action }}" = "synchronize" ] && [ -z "$(review_id_for_head)" ]; then
            gh api "repos/${REPO}/issues/${PR}/comments" -f body="@codex review" >/dev/null
            echo "Posted '@codex review' for the new head."
          fi

          DEADLINE=$((SECONDS + 480))
          RID=""
          while [ ${SECONDS} -lt ${DEADLINE} ]; do
            RID="$(review_id_for_head)"
            [ -n "${RID}" ] && break
            if fail_open_is_active && [ "$(codex_limit_reported)" -gt 0 ]; then
              echo "::warning::Codex reported exhausted review limits. Review is temporarily advisory until 2026-08-09T01:00:00Z; CI remains required."
              exit 0
            fi
            sleep 20
          done

          if [ -z "${RID}" ]; then
            if fail_open_is_active; then
              echo "::warning::No Codex review arrived. Review is temporarily advisory until 2026-08-09T01:00:00Z; CI remains required."
              exit 0
            fi
            echo "::error::No Codex review arrived for ${HEAD_SHA}. Verify that Codex Automatic Reviews is enabled; merge remains blocked."
            exit 1
          fi

          # Inline comments may land just after the review object.
          sleep 15

          PATTERN='\[BLOCKER\]|badge/P1|P1 Badge'
          INLINE=$(gh api "repos/${REPO}/pulls/${PR}/comments" --paginate \
            --jq ".[] | select(.pull_request_review_id == ${RID}) | .body" \
            | grep -cE "${PATTERN}" || true)
          BODY=$(gh api "repos/${REPO}/pulls/${PR}/reviews/${RID}" --jq '.body' \
            | grep -cE "${PATTERN}" || true)

          if [ "$((INLINE + BODY))" -gt 0 ]; then
            echo "::error::Codex reports P1/[BLOCKER] findings on ${HEAD_SHA}. Auto-fix must push a fix; the gate will re-run on the new head."
            exit 1
          fi

          echo "Codex review is green for ${HEAD_SHA}."
