name: codex-review-window
# This file is a STUB. The gate itself lives in dsmolchanov/codex-review-gate,
# a PUBLIC repository holding the workflow and its executable tests
# (tests/test_gate_behavior.py runs the gate's shell under a stubbed gh and
# asserts exit codes). It must be public: a PUBLIC consumer cannot call a
# reusable workflow from a private repository — the run fails with zero jobs
# and no annotation. Verified by probe, not by documentation. Keeping the body here put one file in front of eight
# independent reviewers at once and produced 21 blocking findings, no two
# repositories agreeing and several asking for tests that exist in two of the
# eight. A change to the gate is now reviewed once, where it can be tested.
#
# DO NOT paste the gate body back into this file. If you need to change the
# gate, change it in dev-agent and move the tag below.
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  # A review that lands after the wait window expired must re-open the gate;
  # `pull_request` events alone never fire again for a late review.
  pull_request_review:
    types: [submitted]

# `issue_comment` is DELIBERATELY ABSENT: a comment event runs from the default
# branch, so its check run can never satisfy a PR's required check, and it would
# cancel the real PR-associated run through the concurrency group below. The
# gate posts its own anchor comment, which made an earlier revision
# self-cancelling.
concurrency:
  group: codex-review-window-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # The job key sets the check-run name branch protection matches. A reusable
  # workflow reports as `<caller job> / <called job>`, so both are named
  # `codex-review-window` and the required context becomes
  # `codex-review-window / codex-review-window`. Renaming either half silently
  # removes the gate — branch protection waits on a context that never reports.
  codex-review-window:
    # PINNED TO A COMMIT SHA, not to `@v1`. This caller forwards
    # CODEX_REQUEST_TOKEN, SLACK_WEBHOOK and a write-capable workflow token to
    # whatever that ref resolves to. A tag is mutable: retagging `v1` — by
    # compromise or by accident — would silently change the code holding those
    # secrets in every consumer at once, with no diff anywhere to review.
    # The SHA below pins gate revision 4d05f69 (codex-review-gate#15, atop the
    # per-finding review debt of #10): on a degraded round the gate files one
    # issue per deferred finding, and the finding's identity comes from
    # scripts/review_debt.py in the gate repository, fetched at this pinned
    # revision (job.workflow_sha), fail-soft — never a moving ref. The gate waits
    # 120s for a verdict only where an ACTIVE waker with an `issue_comment`
    # trigger exists on the default branch — the probe reads the trigger, not
    # the workflow's name, because a `workflow_call` host is `active` too and
    # can wake nothing — and keeps 900s otherwise. A verdict arriving later
    # re-enters the gate instead of being caught by an in-run poll: a formal
    # review through the gate's own `pull_request_review` trigger (the waker
    # then drains the stale failed run that re-entry leaves behind), a
    # clean-summary comment through the codex-verdict-waker stub INSTALLED
    # ALONGSIDE THIS FILE. The two stubs are two halves of one protocol:
    # bumping this pin without the waker (or vice versa) leaves clean PRs red
    # until a human re-runs the gate. Keep both pins in lockstep. To move the
    # pin, read the host diff first, then change this line: the bump is the
    # review.
    uses: dsmolchanov/codex-review-gate/.github/workflows/codex-review-window.yml@4d05f6909650381037fee2cfed40c6a5cab591af
    permissions:
      # actions:read is for the gate's waker probe — it reads the waker
      # workflow's state to size its verdict window; a called workflow's
      # permissions cannot exceed its caller's, so the grant must live here.
      actions: read
      contents: read
      # write, not read: on a round past the review budget the gate merges
      # over open P1s and records each deferred finding as ITS OWN review-debt
      # issue, keyed on a fingerprint of the path and the complete finding
      # line and deduplicated against open titles — a finding that blocks
      # nothing and is recorded nowhere is a finding deleted, and a bundle is
      # open or closed for everything in it. The gate still writes no labels
      # and never reads an issue to authorize anything.
      issues: write
      pull-requests: write
    secrets:
      CODEX_REQUEST_TOKEN: ${{ secrets.CODEX_REQUEST_TOKEN }}
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
