name: dependency-audit

# Known-vulnerability scan of the Python dependency set, for Google's CASA
# assessment and ordinary hygiene. Deliberately NOT a job in `ci`: the
# production deploy runs on `ci` succeeding, and an advisory published overnight
# must not freeze deploys — including the deploy that ships its fix. It runs on
# every PR, on main, and weekly, so a new advisory surfaces without a push.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: pip install --disable-pip-version-check "pip-audit==2.10.0"
      - name: Audit runtime and development requirements
        run: pip-audit --progress-spinner off -r requirements-dev.txt
