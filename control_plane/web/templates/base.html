<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>{% block title %}Abrolia{% endblock %}</title>
    <link rel="stylesheet" href="/static/onboarding.css">
    <script src="/static/onboarding.js" defer></script>
  </head>
  <body data-page="{% block page %}base{% endblock %}">
    <header class="site-header">
      <a class="brand" href="/">Abrolia</a>
      <span class="environment">Synthetic staging — no real family data</span>
    </header>
    <main>{% block content %}{% endblock %}</main>
  </body>
</html>
