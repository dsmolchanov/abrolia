# gitleaks-конфиг Gate −1. Сканируется вся история (`--log-opts=--all`),
# вывод — только в redacted-режиме.

title = "hermes-cloud"

[extend]
useDefault = true

[[rules]]
id = "anthropic-api-key"
description = "Anthropic API key"
regex = '''sk-ant-[A-Za-z0-9\-_]{16,}'''
keywords = ["sk-ant-"]

[[rules]]
id = "telegram-bot-token"
description = "Telegram bot token"
regex = '''\b\d{8,10}:[A-Za-z0-9_\-]{35,}'''
keywords = [":AA"]

[[rules]]
id = "nerve-api-key"
description = "Nerve cloud API key"
regex = '''\bnrv_[A-Za-z0-9]{24,}\b'''
keywords = ["nrv_"]

[[rules]]
id = "evolution-instance-apikey"
description = "Evolution (WhatsApp relay) instance apikey"
regex = '''(?i)(evolution[_-]?api[_-]?key|EVOLUTION_APIKEY)\s*[:=]\s*['\"][A-Za-z0-9\-_]{16,}['\"]'''
keywords = ["evolution"]

