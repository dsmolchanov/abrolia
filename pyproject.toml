# Both runtime packages are installed as the Abrolia distribution:
# source-tree tests retain `pythonpath = ["."]`, while packaging includes
# the household runtime and the metadata-only onboarding control plane.

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "abrolia"
version = "0.1.0"
description = "Abrolia family operations assistant and onboarding control plane"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.120,<1",
    "cryptography>=43,<46",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "jinja2>=3.1,<4",
    "pydantic>=2.9,<3",
    "python-dotenv>=1.0,<2",
    "python-multipart>=0.0.20,<1",
    "tldextract>=5.1,<6",
    "uvicorn>=0.38,<1",
]

[project.scripts]
hermes-cloud = "hermes_cloud.cli:main"
abrolia-control-plane = "control_plane.cli:main"

[tool.setuptools.packages.find]
include = ["hermes_cloud*", "control_plane*"]

[tool.setuptools.package-data]
control_plane = ["migrations/*.sql", "web/templates/*.html", "web/static/*"]

[tool.ruff]
line-length = 110
target-version = "py312"
exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E501"]  # параметризованные строки-образцы не переносятся

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --import-mode=importlib"
markers = [
    "live: обращается к внешним API (Anthropic, Nerve, Google) — не идёт в обычном CI",
]
