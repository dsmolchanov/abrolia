# Конфигурация инструментов. Пакет `hermes_cloud` устанавливать не требуется:
# тесты и CLI работают из корня репозитория (`pythonpath = ["."]`), упаковка —
# вопрос Фазы 5 вместе с провижинингом.

[tool.ruff]
line-length = 110
target-version = "py312"
exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # параметризованные строки-образцы не переносятся

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
    "live: обращается к внешним API (Anthropic, Nerve, Google) — не идёт в обычном CI",
]
