<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="/manifest.json">
<title>Abrolia — Web chat</title>
</head>
<body>
<main id="chat">
<p>Web chat — authenticated via same pipeline. P11 push disabled in Phase E.</p>
<form id="form"><input id="input" type="text" placeholder="Сообщение"><button type="submit">Отправить</button></form>
<div id="messages"></div>
</main>
<script>
const form = document.getElementById('form');
const input = document.getElementById('input');
const messages = document.getElementById('messages');
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  const res = await fetch('/api/web/message', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({text})
  });
  const data = await res.json().catch(() => ({}));
  const p = document.createElement('p');
  p.textContent = data.reply || data.detail || 'ошибка';
  messages.appendChild(p);
  input.value = '';
});
if ('serviceWorker' in navigator) { navigator.serviceWorker.register('/sw.js').catch(()=>{}); }
</script>
</body>
</html>
